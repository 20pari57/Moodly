<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moodly - Mood Chatbot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M9 11h.01M15 11h.01"/></svg>
      </div>
      <div>
        <h1>Moodly</h1>
        <p>Pick a mood, start talking</p>
      </div>
    </div>
    <div class="moods" id="moods"></div>
  </aside>

  <main class="chat">
    <header class="chat-header">
      <div class="chat-title">
        <span class="chat-avatar" id="avatar"></span>
        <div>
          <h2 id="moodName">Friendly Chatbot</h2>
          <p><span class="dot"></span>Online</p>
        </div>
      </div>
      <button type="button" class="clear-btn" id="clearBtn">Clear chat</button>
    </header>

    <div class="messages" id="messages"></div>

    <form class="composer" id="form">
      <label for="msg" class="sr-only">Your message</label>
      <input id="msg" type="text" autocomplete="off" placeholder="Type your message...">
      <button type="submit" class="send-btn" aria-label="Send message">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg>
      </button>
    </form>
  </main>

</div>
<script src="script.js"></script>
</body>
</html>
